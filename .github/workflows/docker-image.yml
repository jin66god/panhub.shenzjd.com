name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - "nuxt.config.*"
      - "app.vue"
      - "app/**"
      - "assets/**"
      - "components/**"
      - "composables/**"
      - "layouts/**"
      - "pages/**"
      - "plugins/**"
      - "public/**"
      - "server/**"
      - "shared/**"
      - "types/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.arch }} image (native ${{ matrix.arch }} runner)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          image="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 每平台 job 只推带架构后缀的 tag（latest-amd64 / sha-xxx-arm64 等），
      # 最终的多架构 latest / sha tag 由 merge job 用 imagetools create 合并。
      - name: Build and push ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest-${{ matrix.arch }}
            ${{ steps.image.outputs.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=PanHub Nuxt server image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && !cancelled()
    steps:
      - name: Normalize image name
        run: |
          image="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge platform images into multi-arch tags
        run: |
          set -e
          IMAGE="${IMAGE}"
          SHA_LONG="${{ github.sha }}"
          SHA_SHORT="${SHA_LONG:0:7}"

          # latest 多架构标签
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"
          echo "created ${IMAGE}:latest"

          # sha 长/短 多架构标签
          docker buildx imagetools create \
            -t "${IMAGE}:${SHA_LONG}" \
            "${IMAGE}:sha-${SHA_LONG}-amd64" \
            "${IMAGE}:sha-${SHA_LONG}-arm64"
          echo "created ${IMAGE}:${SHA_LONG}"

          docker buildx imagetools create \
            -t "${IMAGE}:${SHA_SHORT}" \
            "${IMAGE}:sha-${SHA_LONG}-amd64" \
            "${IMAGE}:sha-${SHA_LONG}-arm64"
          echo "created ${IMAGE}:${SHA_SHORT}"

      - name: Inspect merged manifest
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest"

  deploy:
    name: Deploy to server
    needs: merge
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check deploy secrets
        id: deploy_config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets are not fully configured; skipping SSH deploy."
          fi

      - name: Deploy to server
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            IMAGE="${{ needs.build.outputs.image }}:latest"
            CONTAINER="${{ github.event.repository.name }}"
            DATA_DIR="/opt/1panel/apps/openresty/openresty/www/sites/panhub.shenzjd.com/index"

            echo "=== 登录 GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "=== 拉取最新镜像 ==="
            sudo docker pull "$IMAGE"

            echo "=== 停止旧容器 ==="
            sudo docker stop "$CONTAINER" || true
            sudo docker rm "$CONTAINER" || true

            echo "=== 准备数据目录 ==="
            sudo mkdir -p "$DATA_DIR"
            sudo chmod 777 "$DATA_DIR"

            echo "=== 启动新容器 ==="
            sudo docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 5253:4000 \
              -v "$DATA_DIR:/app/data" \
              "$IMAGE"

            echo "=== 等待健康检查 ==="
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:5253/api/health >/dev/null; then
                echo "Health check passed"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Health check failed"
                sudo docker logs "$CONTAINER" --tail 100 || true
                exit 1
              fi
              sleep 2
            done

            echo "=== 清理旧镜像 ==="
            sudo docker image prune -f

            echo "=== 部署完成 ==="
            sudo docker ps --filter "name=$CONTAINER"
